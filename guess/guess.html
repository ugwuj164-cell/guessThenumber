<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="guess.css">
   
</head>
<body>
    <Section class="container">
        <h1>Welcome to my guessing game!</h1>
        <h3>Guess a number from 1-100!</h3>
        <form action="" id="number">
        <input type="number" id="guess-input">
        <button onclick="game()"> guess </button>  
        

      


    </Section>


    <script>
        let randomNumber = Math.floor( Math.random()*100); // provides random numbers
      
        function game(){
              let userGuess = Number(document.getElementById("guess-input").value);
        

             if(userGuess === randomNumber) {

             alert("Correct!!");
           
            }


            else if( userGuess > randomNumber){
               alert("Too High!");

            }

            else {
                alert("Too Low!");

            }

           

        };     
    
        
    </script>
</body>
</html>
